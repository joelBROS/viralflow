name: Unpack ViralFlow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ViralFlow
        run: |
          ZIP="ViralFlow-V12-FREE-TELEGRAM-RENDER.zip"

          if [ -f "$ZIP" ]; then
            mkdir -p /tmp/viralflow
            unzip -q "$ZIP" -d /tmp/viralflow
            cp -a /tmp/viralflow/viralflow-v12/. .
            rm -f "$ZIP"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A
            git commit -m "Extract ViralFlow project" || true
            git push
          else
            echo "ZIP already extracted."
          fi
